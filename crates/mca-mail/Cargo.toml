[package]
name = "mca-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCA Mail — AI email agent for MCA Logistics"

[lib]
name = "mca_mail"
path = "src/lib.rs"

[[bin]]
name = "mca-mail"
path = "src/main.rs"

[dependencies]
mca-mail-testkit = { path = "../mca-mail-testkit" }
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
hyper.workspace = true
reqwest.workspace = true
lettre.workspace = true
mail-parser.workspace = true
html2text.workspace = true
async-imap.workspace = true
async-native-tls.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
once_cell.workspace = true
mime.workspace = true
zip.workspace = true
quick-xml.workspace = true
dotenvy.workspace = true
figment.workspace = true
uncased.workspace = true
utoipa.workspace = true
prometheus.workspace = true
url.workspace = true
mime_guess.workspace = true
zeroize.workspace = true

[dev-dependencies]
http-body-util.workspace = true
# `test-util` is what makes `#[tokio::test(start_paused = true)]` work, so the
# backoff and timeout tests can assert on virtual time instead of sleeping.
tokio = { workspace = true, features = ["test-util"] }
