<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCA Mail — панель</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <h1>MCA Mail</h1>
    <p class="muted">Вход в панель управления</p>
    <label>Логин
      <input id="login-input" name="username" autocomplete="username" required>
    </label>
    <label>Пароль
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn primary">Войти</button>
    <p id="login-error" class="error hidden"></p>
  </form>
</div>

<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="brand">MCA&nbsp;Mail</div>
    <nav id="nav">
      <a href="#/dashboard" data-page="dashboard">Дашборд</a>
      <a href="#/emails" data-page="emails">Письма</a>
      <a href="#/leads" data-page="leads">Лиды</a>
      <a href="#/models" data-page="models">Модели</a>
      <a href="#/usage" data-page="usage">Стоимость</a>
      <a href="#/pipeline" data-page="pipeline">Пайплайн</a>
      <a href="#/events" data-page="events">События</a>
    </nav>
    <div class="sidebar-foot">
      <div id="user-box" class="muted small"></div>
      <button id="logout-btn" class="btn ghost">Выйти</button>
    </div>
  </aside>
  <main id="main" class="main">
    <div class="muted">Загрузка…</div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
