name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stack
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push MCA-Mail API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kotyara12345678/mca-mail:latest
            ghcr.io/kotyara12345678/mca-mail:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: PROD_ENV
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            ROOT=/srv/mca
            command -v git >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq git curl)
            command -v docker >/dev/null 2>&1 || (curl -fsSL https://get.docker.com | sh)
            mkdir -p "$ROOT"

            sync_repo() {
              dir="$1"; url="$2"
              if [ ! -d "$ROOT/$dir/.git" ]; then
                git clone --depth 1 "$url" "$ROOT/$dir"
              else
                cd "$ROOT/$dir" && git fetch --depth 1 origin main && git reset --hard origin/main
              fi
            }
            sync_repo MCA-Mail  https://github.com/kotyara12345678/MCA-Mail.git
            sync_repo MCA-phone https://github.com/kotyara12345678/MCA-phone-.git

            echo '== cleanup: old stack, caches, artifacts =='
            if [ -f /root/MCA-Mail/docker-compose.yml ]; then
              (cd /root/MCA-Mail && docker compose down --remove-orphans) || true
              rm -rf /root/MCA-Mail
            fi
            rm -rf /root/MCA-Mail/target 2>/dev/null || true
            docker container prune -f >/dev/null 2>&1 || true
            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            journalctl --vacuum-size=100M >/dev/null 2>&1 || true
            apt-get autoremove -y >/dev/null 2>&1 || true

            echo '== install auto-clean cron (daily 04:17) =='
            command -v crontab >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq cron)
            systemctl enable --now cron >/dev/null 2>&1 || service cron start >/dev/null 2>&1 || true
            cat > /usr/local/bin/mca-autoclean <<'AUTOCLEAN'
            #!/bin/sh
            docker builder prune -af --keep-storage 2GB >/dev/null 2>&1 || true
            docker image prune -af >/dev/null 2>&1 || true
            docker container prune -f >/dev/null 2>&1 || true
            docker network prune -f >/dev/null 2>&1 || true
            journalctl --vacuum-size=100M >/dev/null 2>&1 || true
            AUTOCLEAN
            chmod +x /usr/local/bin/mca-autoclean
            ( crontab -l 2>/dev/null | grep -v mca-autoclean; echo '17 4 * * * /usr/local/bin/mca-autoclean' ) | crontab -

            echo '== runtime env from CI secret =='
            printf '%s\n' "$PROD_ENV" > "$ROOT/MCA-phone/prod/.env"

            cd "$ROOT/MCA-phone"
            echo '== pull prebuilt images =='
            docker compose -f prod/docker-compose.yml pull
            echo '== up =='
            docker compose -f prod/docker-compose.yml up -d --remove-orphans

            echo '== wait for MCA API =='
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:8080/health >/dev/null && break
              sleep 2
            done

            echo '== bootstrap voice API key =='
            if ! docker compose -f prod/docker-compose.yml exec -T mca-mail /app/mca-mail api-key list 2>/dev/null | grep -q voice-ci; then
              OUT=$(docker compose -f prod/docker-compose.yml exec -T mca-mail /app/mca-mail api-key create --name voice-ci --role operator --created-by deploy 2>/dev/null || true)
              KEY=$(echo "$OUT" | awk '/key:/{print $2}')
              if [ -n "$KEY" ]; then
                sed -i "s/^MCA_API_KEY=.*/MCA_API_KEY=$KEY/" prod/.env
                docker compose -f prod/docker-compose.yml up -d --force-recreate mca-mail ai_engine local_ai_server
              fi
            fi

            echo '== status =='
            docker compose -f prod/docker-compose.yml ps
            df -h / | tail -1
            free -h | head -2
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
