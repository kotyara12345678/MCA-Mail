services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mca
      POSTGRES_PASSWORD: mca
      POSTGRES_DB: mca_mail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mca"]
      interval: 5s
      timeout: 5s
      retries: 5

  mca-mail:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://mca:mca@postgres:5432/mca_mail
      MAIL_PROVIDER: mock
      LLM_PROVIDER: mock
      EMAIL_MODE: dry_run
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata: