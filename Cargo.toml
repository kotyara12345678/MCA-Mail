[workspace]
resolver = "2"
members = ["crates/mca-mail", "crates/mca-mail-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "timeout", "catch-panic"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
] }
mail-parser = "0.11"
html2text = "0.14"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1"
once_cell = "1"
mime = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
uncased = "0.9"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
prometheus = { version = "0.13", default-features = false }
url = "2"
mime_guess = "2"
percent-encoding = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
